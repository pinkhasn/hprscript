[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hprscript-mcp"
version = "0.1.0"
description = "MCP server exposing hprscript multi-pattern PCRE search to AI agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
hprscript-mcp = "hprscript_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["hprscript_mcp"]
