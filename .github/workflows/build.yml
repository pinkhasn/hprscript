name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Build Linux on the oldest still-supported Ubuntu so the
          # dynamically-linked glibc stays broadly compatible.
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            # Keep the x86-64 release asset named `hprscript` so the documented
            # releases/latest/download/hprscript URL stays stable.
            asset: hprscript
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            asset: hprscript-linux-arm64
          # Apple Silicon. macos-14+ runners are arm64.
          - os: macos
            arch: arm64
            runner: macos-14
            asset: hprscript-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ragel pkg-config \
            libboost-dev libsimde-dev

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install cmake ragel pkg-config boost simde bash

      - name: Cache vectorscan
        id: cache-vectorscan
        uses: actions/cache@v4
        with:
          path: /opt/vectorscan
          key: vectorscan-${{ runner.os }}-${{ runner.arch }}-nofat-v2

      - name: Build vectorscan
        if: steps.cache-vectorscan.outputs.cache-hit != 'true'
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          git clone --depth 1 --recurse-submodules \
            https://github.com/VectorCamp/vectorscan.git /tmp/vectorscan
          cmake -S /tmp/vectorscan -B /tmp/vectorscan/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=OFF \
            -DFAT_RUNTIME=OFF \
            -DBUILD_TOOLS=OFF -DBUILD_UNIT=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/vectorscan
          cmake --build /tmp/vectorscan/build -j"$jobs"
          sudo cmake --install /tmp/vectorscan/build

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Show binary info
        run: |
          file hprscript
          ldd hprscript || otool -L hprscript || true
          ./hprscript -h | head -20 || true

      - name: Run tests
        run: make test

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hprscript-${{ matrix.os }}-${{ matrix.arch }}
          path: hprscript
          if-no-files-found: error

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "hprscript" != "${{ matrix.asset }}" ]; then
            cp hprscript "${{ matrix.asset }}"
          fi

      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
